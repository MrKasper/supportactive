<!-- templates/404.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | Support Active</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-container {
            text-align: center;
            color: white;
            padding: 40px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            margin-bottom: 0;
            line-height: 1;
        }
        .error-message {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 30px;
        }
        .error-description {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 40px;
        }
        .btn-home {
            background: white;
            color: #667eea;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            border: none;
            font-size: 16px;
        }
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            color: #667eea;
        }
        .btn-back {
            background: transparent;
            color: white;
            border: 2px solid white;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 16px;
            margin-left: 10px;
        }
        .btn-back:hover {
            background: white;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="mb-4">
            <i class="bi bi-question-circle" style="font-size: 80px;"></i>
        </div>
        <h1 class="error-code">404</h1>
        <p class="error-message">Страница не найдена</p>
        <p class="error-description">
            Запрашиваемая страница не существует или была перемещена.
        </p>
        <div>
            <a href="/" class="btn-home">
                <i class="bi bi-house-door"></i> На главную
            </a>
            <a href="javascript:history.back()" class="btn-back">
                <i class="bi bi-arrow-left"></i> Назад
            </a>
        </div>
    </div>
</body>
</html>
