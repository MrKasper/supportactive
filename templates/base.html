<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Active - Система управления заявками</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='logo.ico') }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='logo.ico') }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

    <!-- Пользовательские стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* Основные стили */
        :root {
            --primary-color: #4e73df;
            --sidebar-width: 220px;
            --header-height: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fc;
            font-size: 14px;
            overflow-x: hidden;
        }

        /* Боковое меню */
        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #4e73df 0%, #224abe 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            z-index: 1000;
            transition: all 0.3s;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h4 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .sidebar-menu {
            padding: 10px 0;
        }

        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            margin: 2px 10px;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .sidebar .nav-link i {
            margin-right: 10px;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.15);
            color: white;
            transform: translateX(5px);
        }

        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.25);
            color: white;
            font-weight: 600;
        }

        /* Основной контент */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
            min-height: 100vh;
        }

        /* Карточка пользователя */
        .user-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e3e6f0;
        }

        .avatar-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-right: 20px;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Карточки статистики */
        .stats-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e3e6f0;
            transition: transform 0.3s;
        }

        .stats-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stats-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .stats-label {
            font-size: 12px;
            color: #858796;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Секция фильтров */
        .filters-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e3e6f0;
        }

        .filters-section label {
            font-weight: 600;
            color: #5a5c69;
            margin-bottom: 5px;
            font-size: 13px;
        }

        /* Таблица */
        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e3e6f0;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background-color: #f8f9fc;
            border-bottom: 2px solid #e3e6f0;
            color: #5a5c69;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 12px;
            vertical-align: middle;
        }

        .task-row {
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-row:hover {
            background-color: #f8f9fc !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Статусы заявок */
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .status-new {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        .status-progress {
            background-color: #fff3e0;
            color: #e65100;
        }

        .status-completed {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .status-cancelled {
            background-color: #ffebee;
            color: #c62828;
        }

        /* Приоритеты */
        .priority-high {
            color: #d32f2f;
            font-weight: bold;
        }

        .priority-medium {
            color: #f57c00;
        }

        .priority-low {
            color: #388e3c;
        }

        /* Модальные окна */
        .modal-content {
            border-radius: 15px;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            border-radius: 15px 15px 0 0;
            border-bottom: none;
            padding: 20px;
        }

        .modal-body {
            padding: 25px;
        }

        .modal-footer {
            border-top: none;
            padding: 20px;
        }

        /* Кнопки */
        .btn {
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 13px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);
            border: none;
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
            color: white;
        }

        .btn-outline-primary {
            border: 2px solid #667eea;
            color: #667eea;
            background: white;
        }

        .btn-outline-primary:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .btn-outline-secondary {
            border: 2px solid #6c757d;
            color: #6c757d;
            background: white;
        }

        .btn-outline-secondary:hover {
            background: #6c757d;
            color: white;
        }

        .btn-outline-success {
            border: 2px solid #28a745;
            color: #28a745;
            background: white;
        }

        .btn-outline-success:hover {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border-color: transparent;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Бейджи */
        .badge {
            font-weight: 500;
            padding: 5px 10px;
            font-size: 11px;
        }

        .bg-secondary {
            background-color: #858796 !important;
        }

        /* Формы */
        .form-label {
            font-weight: 600;
            color: #5a5c69;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .form-select, .form-control {
            border-radius: 8px;
            border: 1px solid #d1d3e2;
            padding: 8px 12px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-select:focus, .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        /* Контекстное меню */
        .context-menu {
            position: fixed;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            z-index: 9999;
            min-width: 220px;
            padding: 8px 0;
            border: 1px solid #e0e0e0;
        }

        .context-menu-item {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background-color 0.2s;
            font-size: 14px;
            color: #333;
            user-select: none;
        }

        .context-menu-item:hover {
            background-color: #f0f0f0;
        }

        .context-menu-item i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .context-menu-item.text-danger {
            color: #dc3545;
        }

        .context-menu-item.text-danger:hover {
            background-color: #fff5f5;
        }

        .context-menu-divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 8px 0;
        }

        /* Чекбоксы */
        .task-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        /* Белый квадрат для логотипа в боковом меню */
        .logo-wrapper-sidebar {
            background: white;
            border-radius: 12px;
            padding: 12px;
            display: inline-block;
            margin-bottom: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .logo-wrapper-sidebar img {
            display: block;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }

            .sidebar .nav-link span {
                display: none;
            }

            .sidebar-header h4 {
                display: none;
            }

            .sidebar-header small {
                display: none;
            }

            .logo-wrapper-sidebar {
                padding: 8px;
            }

            .logo-wrapper-sidebar img {
                max-width: 40px !important;
            }

            .main-content {
                margin-left: 60px;
            }

            .sidebar .nav-link {
                justify-content: center;
                padding: 12px;
            }

            .sidebar .nav-link i {
                margin-right: 0;
                font-size: 1.3rem;
            }

            .table-responsive {
                font-size: 12px;
            }

            .btn {
                font-size: 12px;
                padding: 6px 12px;
            }

            .user-card .d-flex {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .avatar-circle {
                margin-right: 0;
                margin-bottom: 10px;
            }

            .stats-card {
                padding: 10px;
            }

            .stats-number {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 для красивых уведомлений -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
