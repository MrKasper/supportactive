<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForgotPasswordForm · Ижевский техникум</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #eef2f7 0%, #d5dfec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 40px -10px rgba(0, 20, 40, 0.25), 0 8px 20px -6px rgba(0, 0, 0, 0.08);
            padding: 2.2rem 2.2rem 2.4rem;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 2px solid transparent;
        }

        /* ✨ вся форма при наведении ✨ */
        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 30px 60px -12px rgba(0, 20, 40, 0.4), 0 12px 28px -8px rgba(0, 0, 0, 0.15);
            border-color: #1f2b4b;
            background: #fcfdff;
        }

        /* ---------- заголовок ---------- */
        .form-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #141f33;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.2rem;
            transition: color 0.3s ease;
        }
        .card:hover .form-title {
            color: #0b1428;
        }
        .form-title i {
            color: #1f2b4b;
            font-size: 1.8rem;
            opacity: 0.9;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        .card:hover .form-title i {
            transform: scale(1.08) rotate(-2deg);
            color: #141f3a;
        }

        .form-subhead {
            font-size: 0.95rem;
            font-weight: 500;
            color: #2c3e5c;
            border-left: 3px solid #b8cbdf;
            padding-left: 0.8rem;
            margin-bottom: 1.8rem;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: border-color 0.3s ease, color 0.3s ease;
        }
        .card:hover .form-subhead {
            border-left-color: #1f2b4b;
            color: #141f33;
        }
        .form-subhead i {
            font-size: 0.9rem;
            opacity: 0.7;
            transition: transform 0.3s ease;
        }
        .card:hover .form-subhead i {
            transform: translateX(4px);
        }

        /* ---------- поля ввода ---------- */
        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1d2b44;
            letter-spacing: 0.2px;
            margin-bottom: 0.3rem;
            opacity: 0.8;
            transition: color 0.3s ease;
        }
        .card:hover .input-group label {
            color: #0f1a2e;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #f3f7fd;
            border-radius: 20px;
            padding: 0.1rem 1rem;
            border: 1px solid #e0e9f5;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ✨ поле при наведении ✨ */
        .input-wrapper:hover {
            border-color: #1f2b4b;
            background: #f8faff;
            box-shadow: 0 4px 12px rgba(31, 43, 75, 0.08);
            transform: scale(1.01);
        }

        .input-wrapper:focus-within {
            border-color: #1f2b4b;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(31, 43, 75, 0.10);
        }

        .input-wrapper i {
            color: #5f7397;
            font-size: 1rem;
            width: 1.4rem;
            opacity: 0.6;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .input-wrapper:hover i {
            color: #1f2b4b;
            opacity: 0.8;
            transform: scale(1.1);
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.8rem 0.2rem 0.8rem 0.2rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            color: #0a172b;
            outline: none;
            transition: color 0.3s ease;
        }
        .input-wrapper:hover input {
            color: #050d1a;
        }

        .input-wrapper input::placeholder {
            color: #a4b8d4;
            font-weight: 400;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        .input-wrapper:hover input::placeholder {
            opacity: 0.9;
        }

        /* ---------- кнопки: Применить + Отмена ---------- */
        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.4rem;
        }

        .btn-primary, .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            flex: 1;
        }

        /* ✨ кнопка "Применить" ✨ */
        .btn-primary {
            background: #1f2b4b;
            color: white;
            box-shadow: 0 6px 16px rgba(26, 38, 70, 0.25);
        }
        .btn-primary i {
            font-size: 1rem;
            opacity: 0.85;
            transition: transform 0.3s ease;
        }
        .btn-primary:hover {
            background: #141f3a;
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 12px 28px rgba(20, 30, 60, 0.4);
        }
        .btn-primary:hover i {
            transform: translateX(4px) scale(1.1);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        /* ✨ кнопка "Отмена" ✨ */
        .btn-secondary {
            background: #eef3fc;
            color: #1a2a44;
            border: 1px solid #d3def0;
            font-weight: 500;
        }
        .btn-secondary i {
            color: #3b4e72;
            opacity: 0.7;
            transition: transform 0.3s ease;
        }
        .btn-secondary:hover {
            background: #e3eaf7;
            border-color: #b0c3df;
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }
        .btn-secondary:hover i {
            transform: rotate(-8deg) scale(1.1);
        }
        .btn-secondary:active {
            transform: scale(0.97);
        }

        /* ---------- подвал: техникум ---------- */
        .footer-brand {
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid #e3ebf6;
            padding-top: 1.5rem;
            transition: border-color 0.3s ease;
        }
        .card:hover .footer-brand {
            border-top-color: #c8d6e8;
        }
        .footer-brand .tech-name {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 0.8px;
            color: #0e1b30;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .card:hover .footer-brand .tech-name {
            color: #080f1e;
            transform: scale(1.02);
        }
        .footer-brand .tech-name i {
            color: #1f2b4b;
            margin-right: 6px;
            font-size: 1.2rem;
            opacity: 0.8;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        .card:hover .footer-brand .tech-name i {
            transform: rotate(-4deg) scale(1.1);
            color: #141f3a;
        }
        .footer-brand .sub {
            font-weight: 400;
            font-size: 0.85rem;
            color: #3f5679;
            letter-spacing: 1.5px;
            margin-top: 0.15rem;
            opacity: 0.8;
            transition: color 0.3s ease, opacity 0.3s ease;
        }
        .card:hover .footer-brand .sub {
            color: #1f2b4b;
            opacity: 1;
        }
        .footer-brand .sub i {
            color: #273b60;
            margin: 0 6px;
            font-size: 0.8rem;
            opacity: 0.7;
            transition: transform 0.3s ease;
        }
        .card:hover .footer-brand .sub i {
            transform: scale(1.15);
        }

        /* ---------- адаптив ---------- */
        @media (max-width: 480px) {
            .card {
                padding: 1.6rem;
            }
            .form-title {
                font-size: 1.7rem;
            }
            .actions {
                flex-direction: column;
                gap: 0.8rem;
            }
            .btn-primary, .btn-secondary {
                font-size: 1rem;
                padding: 0.75rem;
            }
            .card:hover {
                transform: translateY(-4px) scale(1.005);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Заголовок: ForgotPasswordForm + иконка -->
        <div class="form-title">
            <i class="fas fa-key"></i> ForgotPasswordForm
        </div>
        <div class="form-subhead">
            <i class="fas fa-unlock-alt"></i> Восстановление пароля
        </div>

        <!-- Форма -->
        <form id="forgotPasswordForm" onsubmit="event.preventDefault(); alert('Демо: ссылка для восстановления отправлена (макет)');">

            <!-- Логин -->
            <div class="input-group">
                <label for="loginInput"><i class="fas fa-user" style="margin-right: 4px;"></i> Логин:</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginInput" placeholder="ivanov_i" value="ivanov_i" />
                </div>
            </div>

            <!-- Почта -->
            <div class="input-group">
                <label for="emailInput"><i class="fas fa-envelope" style="margin-right: 4px;"></i> Почта:</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="emailInput" placeholder="ivanov@example.com" value="ivanov@example.com" />
                </div>
            </div>

            <!-- Кнопки: Применить + Отмена -->
            <div class="actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-check"></i> Применить
                </button>
                <button type="button" class="btn-secondary" onclick="alert('Демо: отмена (возврат к авторизации)');">
                    <i class="fas fa-times"></i> Отмена
                </button>
            </div>
        </form>

        <!-- Нижний блок: Ижевский техникум Удмуртпотребсоюза -->
        <div class="footer-brand">
            <div class="tech-name">
                <i class="fas fa-university"></i> ИЖЕВСКИЙ ТЕХНИКУМ
            </div>
            <div class="sub">
                <i class="fas fa-handshake"></i> УДМУРТПОТРЕБСОЮЗА
            </div>
        </div>
    </div>
</body>
</html>
