<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoginForm · Ижевский техникум</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f0f4fa 0%, #d9e2ef 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.35), 0 8px 24px -6px rgba(0, 0, 0, 0.1);
      padding: 2rem 2rem 2.2rem;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    /* заголовок */
    .form-title {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #1a2639;
      margin-bottom: 0.1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .form-title i {
      color: #2c3e77;
      font-size: 1.8rem;
    }

    .form-subhead {
      font-size: 0.95rem;
      color: #4a5b7a;
      font-weight: 400;
      border-left: 3px solid #b0c7e7;
      padding-left: 0.75rem;
      margin-top: -0.1rem;
      margin-bottom: 1.8rem;
      opacity: 0.8;
    }

    /* поля */
    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #2c3e50;
      letter-spacing: 0.3px;
      margin-bottom: 0.3rem;
      opacity: 0.8;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #f2f6fc;
      border-radius: 18px;
      padding: 0.2rem 1rem;
      border: 1px solid #e2eaf5;
      transition: all 0.15s;
    }

    .input-wrapper:focus-within {
      border-color: #2c3e77;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(44, 62, 119, 0.15);
    }

    .input-wrapper i {
      color: #6b7d9f;
      font-size: 1rem;
      width: 1.4rem;
      opacity: 0.6;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.75rem 0.2rem 0.75rem 0.2rem;
      border: none;
      background: transparent;
      font-size: 1rem;
      color: #0b1a2f;
      outline: none;
    }

    .input-wrapper input::placeholder {
      color: #a3b6d0;
      font-weight: 300;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* чекбокс + ссылка */
    .row-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin: 1.2rem 0 1.8rem;
      font-size: 0.9rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: #2c3e50;
      font-weight: 450;
    }

    .checkbox-group input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: #1f2b4b;
      cursor: pointer;
      border-radius: 4px;
    }

    .forgot-link {
      color: #1f2b4b;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dashed #b0c7e7;
      transition: 0.1s;
      cursor: pointer;
    }

    .forgot-link:hover {
      color: #0b1428;
      border-bottom-color: #1f2b4b;
    }

    /* кнопки */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-top: 0.6rem;
    }

    .btn-primary, .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      border: none;
      padding: 0.85rem 1.2rem;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }

    .btn-primary {
      background: #1f2b4b;
      color: white;
      box-shadow: 0 6px 14px rgba(26, 38, 70, 0.25);
    }

    .btn-primary i {
      font-size: 1.1rem;
      opacity: 0.8;
    }

    .btn-primary:hover {
      background: #141f3a;
      transform: scale(1.01);
      box-shadow: 0 8px 18px rgba(20, 30, 60, 0.3);
    }

    .btn-secondary {
      background: #eef3fc;
      color: #1a2a44;
      border: 1px solid #d3def0;
      font-weight: 500;
    }

    .btn-secondary i {
      color: #3b4e72;
      opacity: 0.7;
    }

    .btn-secondary:hover {
      background: #e3eaf7;
      border-color: #b0c3df;
    }

    /* разделитель */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      color: #6a7e9e;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 0.2rem 0 0.4rem;
      opacity: 0.5;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #d5e0ef;
    }

    /* подвал – техникум */
    .footer-brand {
      margin-top: 2rem;
      text-align: center;
      border-top: 1px solid #e3ebf6;
      padding-top: 1.5rem;
    }

    .footer-brand .tech-name {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      color: #0e1b30;
    }

    .footer-brand .sub {
      font-weight: 400;
      font-size: 0.85rem;
      color: #3f5679;
      letter-spacing: 1.2px;
      margin-top: 0.1rem;
      opacity: 0.8;
    }

    .footer-brand i {
      color: #273b60;
      margin: 0 6px;
      font-size: 0.9rem;
    }

    /* адаптив */
    @media (max-width: 480px) {
      .card {
        padding: 1.6rem;
      }
      .form-title {
        font-size: 1.7rem;
      }
      .row-options {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.7rem;
      }
      .btn-primary, .btn-secondary {
        font-size: 1rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Заголовок: LoginForm + Авторизация -->
    <div class="form-title">
      <i class="fas fa-sign-in-alt"></i> LoginForm
    </div>
    <div class="form-subhead">
      <i class="fas fa-key" style="margin-right: 6px; opacity: 0.7;"></i> Авторизация
    </div>

    <!-- Форма -->
    <form id="loginForm" onsubmit="event.preventDefault(); alert('Демо: вход выполнен (макет)');">
      <!-- Логин -->
      <div class="input-group">
        <label for="loginInput"><i class="far fa-user-circle" style="margin-right: 4px;"></i> Ваш логин</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="loginInput" placeholder="ivanov@example.com" value="user@tech">
        </div>
      </div>

      <!-- Пароль -->
      <div class="input-group">
        <label for="passwordInput"><i class="fas fa-lock" style="margin-right: 4px;"></i> Ваш пароль</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="passwordInput" placeholder="••••••••" value="password123">
        </div>
      </div>

      <!-- Запомнить / Забыли пароль? -->
      <div class="row-options">
        <label class="checkbox-group">
          <input type="checkbox" checked> <span>Запомнить меня</span>
        </label>
        <a href="forgotPassword.html" class="forgot-link"><i class="far fa-question-circle"></i> Забыли пароль?</a>
      </div>

      <!-- Кнопки: Войти + Регистрация (разделитель) -->
      <div class="actions">
        <button type="submit" class="btn-primary">
          <i class="fas fa-arrow-right-to-bracket"></i> Войти
        </button>

        <div class="divider">
          <i class="fas fa-ellipsis-h"></i> или <i class="fas fa-ellipsis-h"></i>
        </div>

        <a href="register.html" style="text-decoration: none; width: 100%;">
          <button type="button" class="btn-secondary">
            <i class="fas fa-user-plus"></i> Регистрация
          </button>
        </a>
      </div>
    </form>

    <!-- Нижний блок: Ижевский техникум Удмуртпотребсоюза -->
    <div class="footer-brand">
      <div class="tech-name">
        <i class="fas fa-university"></i> ИЖЕВСКИЙ ТЕХНИКУМ
      </div>
      <div class="sub">
        <i class="fas fa-handshake"></i> УДМУРТПОТРЕБСОЮЗА
      </div>
    </div>
  </div>
</body>
</html>
