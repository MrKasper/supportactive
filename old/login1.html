<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginForm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-window {
            width: 750px;
            background-color: #fff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .title-bar {
            background-color: #2196F3;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .title-bar .title-text {
            font-size: 20px;
            font-weight: bold;
            flex: 1;
            text-align: center;
        }

        .title-bar .window-controls {
            display: flex;
            gap: 8px;
        }

        .title-bar .window-controls button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .title-bar .window-controls button:hover {
            opacity: 0.7;
        }

        .content {
            display: flex;
            min-height: 380px;
        }

        .left-panel {
            width: 45%;
            background-color: #2196F3;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .logo-container {
            background-color: white;
            padding: 20px;
            border-radius: 4px;
            text-align: center;
            width: 220px;
        }

        .logo-icon {
            width: 180px;
            height: 160px;
            margin: 0 auto 10px;
            position: relative;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
        }

        .logo-text-top {
            font-size: 13px;
            font-weight: bold;
            color: #1a3a5c;
            margin-bottom: 2px;
        }

        .logo-text-bottom {
            font-size: 11px;
            color: #2196F3;
        }

        .right-panel {
            width: 55%;
            padding: 30px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #2196F3;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #666;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2196F3;
        }

        .forgot-password {
            font-size: 14px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .buttons-row {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1976D2;
        }

        .btn-secondary {
            background-color: #2196F3;
        }

        .btn-secondary:hover {
            background-color: #1976D2;
        }
    </style>
</head>
<body>
    <div class="login-window">
        <div class="title-bar">
            <span style="font-size: 13px; font-weight: normal;">LoginForm</span>
            <span class="title-text">Авторизация</span>
            <div class="window-controls">
                <button title="Свернуть">—</button>
                <button title="Закрыть"></button>
            </div>
        </div>
        <div class="content">
            <div class="left-panel">
                <div class="logo-container">
                    <div class="logo-icon">
                        <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                            <!-- Book -->
                            <path d="M20 130 Q100 100 180 130 L180 160 Q100 130 20 160 Z" fill="#1565C0"/>
                            <path d="M20 130 Q100 100 180 130 L180 135 Q100 105 20 135 Z" fill="#1976D2"/>
                            <!-- Book spine -->
                            <line x1="100" y1="100" x2="100" y2="160" stroke="#0D47A1" stroke-width="2"/>
                            <!-- Owl body -->
                            <ellipse cx="100" cy="90" rx="55" ry="50" fill="#1565C0"/>
                            <!-- Owl ears -->
                            <polygon points="55,55 45,20 75,45" fill="#1565C0"/>
                            <polygon points="145,55 155,20 125,45" fill="#1565C0"/>
                            <!-- Owl eyes -->
                            <circle cx="78" cy="80" r="22" fill="white"/>
                            <circle cx="122" cy="80" r="22" fill="white"/>
                            <circle cx="78" cy="80" r="12" fill="#1565C0"/>
                            <circle cx="122" cy="80" r="12" fill="#1565C0"/>
                            <circle cx="78" cy="80" r="5" fill="white"/>
                            <circle cx="122" cy="80" r="5" fill="white"/>
                            <!-- Owl beak -->
                            <polygon points="95,95 105,95 100,108" fill="#FFB300"/>
                            <!-- Owl wings -->
                            <path d="M45 90 Q30 110 45 130" fill="none" stroke="white" stroke-width="3"/>
                            <path d="M155 90 Q170 110 155 130" fill="none" stroke="white" stroke-width="3"/>
                        </svg>
                    </div>
                    <div class="logo-text-top">ИЖЕВСКИЙ ТЕХНИКУМ</div>
                    <div class="logo-text-bottom">УДМУРТПОТРЕБСОЮЗА</div>
                </div>
            </div>
            <div class="right-panel">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login">Ваш логин</label>
                        <input type="text" id="login" name="login" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="password">Ваш пароль</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="">
                            <button type="button" class="toggle-password" id="togglePassword" title="Показать пароль">
                                👁
                            </button>
                        </div>
                    </div>
                    <div class="options-row">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            Запомнить меня
                        </label>
                        <a href="#" class="forgot-password">Забыли пароль?</a>
                    </div>
                    <div class="buttons-row">
                        <button type="submit" class="btn">Войти</button>
                        <button type="button" class="btn btn-secondary">Регистрация</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁' : '';
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (login && password) {
                alert('Вход выполнен!\nЛогин: ' + login + '\nЗапомнить: ' + rememberMe);
            } else {
                alert('Пожалуйста, заполните все поля.');
            }
        });
    </script>
</body>
</html>
